<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Lista de Pedidos</title>
</head>
<body class="bg-gray-100 flex flex-col min-h-screen">

    <!-- Menú responsive -->
        <header class="bg-gray-300 p-4 flex justify-between items-center md:hidden">
            <h2 class="font-semibold">Domingo Savio</h2>
            <button id="menu-toggle" class="text-gray-800 text-2xl">☰</button>
        </header>
        
        <nav id="mobile-menu" class="hidden flex flex-col bg-gray-200 p-4 space-y-2 fixed top-0 left-0 w-48 h-full shadow-lg md:hidden">
            <button id="close-menu" class="text-right text-xl">✖</button>
            <a href="../pages/nuevoplato.html" class="block font-semibold hover:bg-gray-400 p-2 rounded"> Agregar producto</a>
            <a href="../pages/complemento.html" class="block font-semibold hover:bg-gray-400 p-2 rounded"> Agregar complementos</a>
            <a href="../pages/verpedidos.html" class="block font-semibold hover:bg-gray-400 p-2 rounded">Verificar pedidos</a>
            <a href="../../user/pages/login.html" class="block font-semibold hover:bg-gray-400 p-2 rounded text-red-600">Cerrar sesión</a>
        </nav>

<!-- Sidebar -->
    <div class="flex flex-1">
        <aside class="bg-gray-300 w-64 p-6 flex flex-col items-center space-y-6 hidden md:flex">
            <img src="../../imgs/Domingo.jpeg" alt="Logo" class="w-20 h-25 rounded-full">
            <h2 class="font-semibold text-lg text-center">Domingo Savio</h2>
            <nav class="w-full">
                <a href="../pages/nuevoplato.html" class="flex items-center space-x-2 p-3 hover:bg-gray-400 rounded">
                    <img src="../../imgs/plato.png" class="w-10" alt="Agregar producto"> <span>Agregar producto</span>
                </a>
                <a href="../pages/complemento.html" class="flex items-center space-x-2 p-3 hover:bg-gray-400 rounded">
                    <img src="../../imgs/saludable.png" class="w-14" alt="Agregar complementos"> <span>Agregar complementos</span>
                </a>
                <a href="../pages/verpedidos.html" class="flex items-center space-x-2 p-3 hover:bg-gray-400 rounded">
                    <img src="../../imgs/foto.png" class="w-10" alt="Verificar pedidos"> <span>Verificar pedidos</span>
                </a>
                <a href="../../user/pages/login.html" class="flex items-center space-x-2 p-3 hover:bg-gray-400 rounded text-red-600">
                    <img src="../../imgs/cerrar-sesion.png" class="w-10" alt="Cerrar sesión"> <span>Cerrar sesión</span>
                </a>
            </nav>
        </aside>

        <!-- Contenido principal -->
        <main class="flex-1 flex flex-col items-center p-6">
            <div class="w-full max-w-2xl space-y-6">

                <!-- Tarjeta de pedido -->
                <div class="flex items-center bg-green-400 rounded-lg shadow-md p-4 space-x-4">
                    <img src="../../imgs/comida.png" alt="Carne asada" class="w-20 h-20">
                    <div class="flex-1 text-lg font-semibold">Carne asada</div>
                    <div class="text-center">
                        <span class="block font-semibold">Total:</span>
                        <span class="text-xl">19</span>
                    </div>
                    <button class="bg-yellow-300 px-4 py-2 rounded shadow hover:bg-yellow-400">Detalles</button>
                </div>

                <!-- Tarjeta de pedido -->
                <div class="flex items-center bg-green-400 rounded-lg shadow-md p-4 space-x-4">
                    <img src="../../imgs/comida.png" alt="Huevo con frijoles" class="w-20 h-20">
                    <div class="flex-1 text-lg font-semibold">Huevo con frijoles</div>
                    <div class="text-center">
                        <span class="block font-semibold">Total:</span>
                        <span class="text-xl">19</span>
                    </div>
                    <button class="bg-yellow-300 px-4 py-2 rounded shadow hover:bg-yellow-400">Detalles</button>
                </div>

            </div>
        </main>
    </div>

    <script>
        const menuToggle = document.getElementById('menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');
        const closeMenu = document.getElementById('close-menu');
        
        menuToggle.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });
        
        closeMenu.addEventListener('click', () => {
            mobileMenu.classList.add('hidden');
        });
    </script>
</body>

</html>
